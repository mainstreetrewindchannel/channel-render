name: Render

# Renders a project from a studio repository and hands the finished files back to that repository's
# releases. Started by hand only: no pull-request or fork triggers, so the secret is never exposed.
on:
  workflow_dispatch:
    inputs:
      studio:
        description: "Studio repository (owner/name)"
        default: mainstreetrewindchannel/channel-studio
      job:
        description: "Job folder in the studio repo, e.g. jobs/2026-11-saturday-1959"
        required: true
      stage:
        description: "all | tts | assemble | shorts | thumbs"
        default: all
      draft:
        description: "Fast low-quality render"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-${{ inputs.studio }}-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - name: Studio files (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.studio }}
          token: ${{ secrets.STUDIO_TOKEN }}
          path: studio

      - name: Use this repo's renderer
        run: |
          mkdir -p studio/scripts/render
          cp render/*.py studio/scripts/render/
          echo "SLUG=$(basename '${{ inputs.job }}')" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-render.txt

      - name: System tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick espeak-ng fonts-dejavu-core > /dev/null
          mkdir -p ~/.local/share/fonts && cp studio/assets/brand/fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null; fc-cache -f > /dev/null

      - name: Python packages
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements-render.txt
          pip install -q "spacy==3.8.7" "preshed==3.0.10"
          pip install -q "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
          python -c "import spacy; spacy.load('en_core_web_sm')"
          python -m playwright install --with-deps chromium > /dev/null

      - name: Restore voice, media and clips
        uses: actions/cache/restore@v4
        with:
          path: |
            studio/out/*/audio
            studio/out/*/media
            studio/out/*/clips
          key: render-${{ inputs.studio }}-${{ inputs.job }}-${{ github.run_id }}
          restore-keys: render-${{ inputs.studio }}-${{ inputs.job }}-

      - name: Render
        run: |
          set -o pipefail
          args="${{ inputs.job }} --stage ${{ inputs.stage }}"
          [ "${{ inputs.draft }}" = "true" ] && args="$args --draft"
          cd studio
          python scripts/render/build.py $args > ../render.log 2>&1 || { echo "::error title=Render failed::$(tail -c 1500 ../render.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Render::$(grep -E '^(final video|short |WARNING)' ../render.log | tr '\n' ' ' | cut -c1-900)"

      - name: Hand files back to the studio repo (private release)
        env:
          GH_TOKEN: ${{ secrets.STUDIO_TOKEN }}
        run: |
          F="studio/out/$SLUG/final"
          tag="render-$SLUG"
          size=$(stat -c %s $F/video.mp4 2>/dev/null || echo 0)
          if [ "$size" -gt 1900000000 ]; then
            ffmpeg -y -loglevel error -i $F/video.mp4 -c:v libx264 -preset medium -crf 20 -maxrate 12M -bufsize 24M -pix_fmt yuv420p -c:a copy -movflags +faststart $F/v2.mp4 && mv $F/v2.mp4 $F/video.mp4
          fi
          gh release view "$tag" -R "${{ inputs.studio }}" > /dev/null 2>&1 || gh release create "$tag" -R "${{ inputs.studio }}" --title "Render: $SLUG" --notes "Rendered files. Private." --prerelease
          gh release upload "$tag" -R "${{ inputs.studio }}" $F/* --clobber > up.log 2>&1 || { echo "::error title=Hand-back failed::$(tail -c 600 up.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Delivered::$(ls $F | tr '\n' ' ') -> ${{ inputs.studio }} release $tag"

      - name: Save voice, media and clips
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            studio/out/*/audio
            studio/out/*/media
            studio/out/*/clips
          key: render-${{ inputs.studio }}-${{ inputs.job }}-${{ github.run_id }}
